        function clearHistory(){

            const key=[historyVersion,width,height,zoom,yaw,pitch,panX,panY,Math.floor(time/((videoSlices&&active.size>300)||active.size>2000?2:.5)),settled.length].join(':');
            if(!historyJob&&key!==historyKey){
                historyBuffer.width=Math.round(width*scale);historyBuffer.height=Math.round(height*scale);
                const paint=historyBuffer.getContext('2d');paint.setTransform(scale,0,0,scale,0,0);paint.clearRect(0,0,width,height);
                paint.lineJoin='round';paint.lineCap=videoSlices?'butt':'round';
                historyJob={key,ctx:paint,index:0,objects:settled,time,project};
            }
            if(historyReady)ctx.drawImage(historyCanvas,0,0,width,height);
            else if(historyJob&&historyJob.index>0)ctx.drawImage(historyBuffer,0,0,width,height);
            for(const {entry}of recent)paintEntry(entry,time,project);
            canvas.dataset.visibleTexts=texts;canvas.dataset.time=time.toFixed(3);canvas.dataset.activeTracks=tracks;canvas.dataset.activeDots=dots;canvas.dataset.total=data.total;canvas.dataset.depthAxis='time';canvas.dataset.renderMs=(performance.now()-renderStart).toFixed(1);canvas.dataset.captionCacheMB=(captionPixels*4/1024/1024).toFixed(1);canvas.dataset.historyVersion=String(historyVersion);canvas.dataset.historyReady=String(historyReady);
        }
        function resize(){width=innerWidth;height=innerHeight;scale=videoSlices&&sliceView?.quality?sliceView.quality:Math.min(crispCaptions?2:1.5,devicePixelRatio||1);canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);clearHistory();render();}
        async function refresh(){
            try{
                const head=await fetch('trajectories-data.json',{method:'HEAD',cache:'no-store'});if(!head.ok)throw Error();
                const stamp=head.headers.get('Last-Modified');if(stamp&&stamp===modified)return;
                let owner=window;try{if(window.top.location.origin===location.origin)owner=window.top;}catch{}
                const shared=owner.__eacTrajectoryDownloads||(owner.__eacTrajectoryDownloads=new Map());
                const key=new URL('trajectories-data.json',location.href).href;
                let download=shared.get(key);
                if(!download||download.stamp!==stamp||(!stamp&&Date.now()-download.created>4000)){
                    download={stamp,created:Date.now(),promise:fetch(key,{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.text();})};shared.set(key,download);
                    const failed=download;download.promise.catch(()=>{if(shared.get(key)===failed)shared.delete(key);});
                }
                const value=JSON.parse(await download.promise);if(value.version!==2)throw Error();modified=stamp;
                if(value.updatedAt!==revision){const time=current(),first=!data;captionPixels=0;data=value;data.entries.sort((a,b)=>a.start-b.start);revision=value.updatedAt;offset=first?(embedded&&hasParentClock?offset:0):time;origin=performance.now();previousTime=-1;clearHistory();render();}
                document.getElementById('error').hidden=true;
            }catch{document.getElementById('error').textContent='Unable to refresh trajectories. Retrying…';document.getElementById('error').hidden=false;}
        }
        canvas.addEventListener('wheel',event=>{event.preventDefault();if(embedded){parent.postMessage({type:'eac:zoom',yaw,delta:event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1)},location.origin);return;}zoom=Math.max(1,Math.min(4,zoom*Math.exp(-event.deltaY*.001)));needsRender=true;},{passive:false});
        let pinchScale=1;
        addEventListener('gesturestart',event=>{if(!embedded)return;event.preventDefault();pinchScale=event.scale||1;},{passive:false});
        addEventListener('gesturechange',event=>{if(!embedded)return;event.preventDefault();const scale=event.scale||1;parent.postMessage({type:'eac:zoom',yaw,delta:-Math.log(scale/pinchScale)*700},location.origin);pinchScale=scale;},{passive:false});
        canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;gesture={x:event.clientX,yaw};canvas.setPointerCapture(event.pointerId);});
        canvas.addEventListener('pointermove',event=>{
            if(!gesture||(archiveVersion&&![18,19].includes(archiveVersion)))return;
            yaw=gesture.yaw+(event.clientX-gesture.x)*.006;
            pitch=0;
            if(embedded)parent.postMessage({type:'eac:orientation',yaw},location.origin);
            needsRender=true;
        });
        canvas.addEventListener('pointerup',()=>{gesture=null;needsRender=true;});canvas.addEventListener('pointercancel',()=>{gesture=null;needsRender=true;});canvas.addEventListener('lostpointercapture',()=>{gesture=null;needsRender=true;});
        canvas.addEventListener('dblclick',()=>{if(embedded)parent.postMessage({type:'eac:reset-depth'},location.origin);zoom=1;panX=panY=0;yaw=0;pitch=0;if(embedded)parent.postMessage({type:'eac:orientation',yaw},location.origin);render();});
        addEventListener('keydown',event=>{
            if(event.key==='Escape'){if(embedded)parent.postMessage({type:'eac:return'},location.origin);else location.href='../';}
            if(embedded)return;
            if(event.code==='Space'){event.preventDefault();offset=current();origin=performance.now();paused=!paused;needsRender=true;}
            if(event.key==='ArrowRight'){event.preventDefault();seek(current()+10);}
            if(event.key==='ArrowLeft'){event.preventDefault();seek(current()-10);}
            if(event.key==='Home'){event.preventDefault();seek(0);}
        });
        if(videoSlices)window.EACSliceRender=(view,clock)=>{
            const previousQuality=sliceView?.quality,previous=current();
            sliceView=view;yaw=view.yaw;zoom=view.zoom;panX=view.travel;
            offset=clock.time;origin=performance.now();paused=clock.paused;embeddedVisible=true;needsRender=true;
            if(Math.abs(offset-previous)>1){previousTime=-1;clearHistory();}
            if(previousQuality!==view.quality)resize();else render();
        };
        addEventListener('message',event=>{
            if(!embedded||event.source!==parent||event.origin!==location.origin)return;
            if(videoSlices&&event.data?.type==='eac:slice-view'){
                const previousQuality=sliceView?.quality;
                sliceView=event.data;yaw=sliceView.yaw;zoom=sliceView.zoom;panX=sliceView.travel;needsRender=true;
                if(previousQuality!==sliceView.quality)resize();
                return;
            }
            if(event.data?.type==='eac:reset-view'){gesture=null;yaw=pitch=panX=panY=0;zoom=1;clearHistory();needsRender=true;return;}
            if(event.data?.type==='eac:space-zoom'){
                const value=Number(event.data.zoom);
                if(Number.isFinite(value)){zoom=Math.max(1,Math.min(4,value));needsRender=true;}
                return;
            }
            if(event.data?.type!=='eac:clock')return;
            const time=Number(event.data.time);if(!Number.isFinite(time))return;hasParentClock=true;
            if(window.EACTrajectorySurface?.setEnabled(event.data.surfaceVisible,event.data.deepInside))needsRender=true;
            const wasVisible=embeddedVisible;
            embeddedVisible=Boolean(event.data.visible);
            const displayed=current(),jump=Math.abs(time-displayed)>1;
            const playing=!Boolean(event.data.paused)&&embeddedVisible;
            offset=!videoSlices&&playing&&!jump?Math.max(time,displayed):time;origin=performance.now();paused=!playing;
            if(jump){previousTime=-1;clearHistory();}
            if(embeddedVisible&&(!wasVisible||jump))needsRender=true;
        });
        addEventListener('resize',resize);
        function tick(now){if(videoSlices){requestAnimationFrame(tick);return;}if(!embeddedVisible){requestAnimationFrame(tick);return;}advanceHistory();if((needsRender||!paused)&&now-lastFrame>=1000/((gesture||(videoSlices&&sliceView?.interacting))?60:30)-1){render();lastFrame=now;}requestAnimationFrame(tick);}
        resize();refresh();setInterval(refresh,5000);requestAnimationFrame(tick);
    </script>
