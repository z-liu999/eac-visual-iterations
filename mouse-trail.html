<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="An interactive experiment: move your pointer and leave a temporary trace.">
  <title>Mouse Trails — EaC</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; color: #161616; }
    body { font-family: "Courier New", Courier, monospace; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 32px; touch-action: none; }
    .intro { text-align: center; pointer-events: none; user-select: none; }
    h1 { margin: 0 0 14px; font-size: clamp(24px, 5vw, 44px); font-weight: 400; letter-spacing: -.05em; }
    p { margin: 0; color: #777; font-size: 12px; line-height: 1.8; }
    footer { position: fixed; bottom: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 20px; align-items: center; font-size: 11px; color: #777; }
    button { font: inherit; color: #161616; padding: 9px 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    button:hover { border-color: #161616; }
    button:focus-visible { outline: 2px solid #161616; outline-offset: 3px; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    @media (max-width: 480px) { footer { bottom: 16px; left: 16px; right: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <h1>Mouse Trails</h1>
      <p>Move your pointer. Every trace fades.<br>On a touch screen, drag your finger.</p>
    </div>
  </main>
  <footer><span>3px / 0.8 seconds / temporary traces</span><button type="button" id="clear">Clear traces</button></footer>
  <canvas aria-hidden="true" id="trail"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('trail');
      const ctx = canvas.getContext('2d');
      const points = [];
      const duration = 800;
      let frame = 0, interrupted = true, pointer = null;

      function clear() {
        cancelAnimationFrame(frame);
        frame = 0;
        points.length = 0;
        interrupted = true;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
      }

      function resize() {
        clear();
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * ratio);
        canvas.height = Math.round(innerHeight * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw(now) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        while (points.length && now - points[0].time > duration) points.shift();
        ctx.lineWidth = 3;
        ctx.lineCap = ctx.lineJoin = 'round';
        for (let i = 1; i < points.length; i++) {
          const a = points[i - 1], b = points[i];
          if (b.break || b.time - a.time > 100) continue;
          ctx.strokeStyle = `rgba(0,0,0,${Math.max(0, 1 - (now - a.time) / duration)})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        frame = points.length ? requestAnimationFrame(draw) : 0;
      }

      document.addEventListener('pointermove', event => {
        if (!event.isPrimary || event.target.closest('button')) { interrupted = true; return; }
        if (event.pointerType !== 'mouse' && !event.buttons) return;
        if (pointer !== event.pointerId) interrupted = true;
        pointer = event.pointerId;
        points.push({ x: event.clientX, y: event.clientY, time: performance.now(), break: interrupted });
        interrupted = false;
        if (!frame) frame = requestAnimationFrame(draw);
      }, { passive: true });
      for (const event of ['pointerleave', 'pointercancel', 'pointerup']) {
        document.addEventListener(event, () => { interrupted = true; });
      }
      document.getElementById('clear').addEventListener('click', clear);
      addEventListener('keydown', event => { if (event.key === 'Escape') clear(); });
      addEventListener('blur', clear);
      document.addEventListener('visibilitychange', () => { if (document.hidden) clear(); });
      addEventListener('resize', resize);
      resize();
    })();
  </script>
</body>
</html>
